<!DOCTYPE html>
<html lang="fr">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta charset="UTF-8">
<title>Quilles de 8 - Match par équipes</title>
<style>
  body { font-family: Arial; background:#eef2f7; padding:20px; }
  .card { background:white; border-radius:12px; padding:20px; margin-bottom:20px; box-shadow:0 4px 10px rgba(0,0,0,0.1); }
  h1 { text-align:center; }
  .teams { display:flex; gap:20px; flex-wrap:wrap; }
  .team { flex:1; }
  input { width:100%; padding:8px; margin:5px 0; border-radius:6px; border:1px solid #ccc; }
  button { padding:12px; border:none; border-radius:8px; background:#4CAF50; color:white; font-size:16px; cursor:pointer; width:100%; }
  table { width:100%; border-collapse:collapse; margin-top:15px; font-size:14px; }
  th, td { border:1px solid #ddd; padding:6px; text-align:center; }
  th { background:#4CAF50; color:white; }
  .teamA { background:#d0ebff; }
  .teamB { background:#ffd6d6; }
</style>
</head>
<body>

<h1>🏆 Match Quilles de 8 (2 équipes)</h1>

<div class="card">
<h2>📋 Informations compétition</h2>
<input id="competitionName" placeholder="Nom de la compétition">
<input id="competitionDate" type="date">
</div>

<div class="card teams">
<div class="team">
<h2>🔵 Équipe A</h2>
<input class="teamA" placeholder="Joueur 1" id="A0">
<input class="teamA" placeholder="Joueur 2" id="A1">
<input class="teamA" placeholder="Joueur 3" id="A2">
<input class="teamA" placeholder="Joueur 4" id="A3">
</div>

<div class="team">
<h2>🔴 Équipe B</h2>
<input class="teamB" placeholder="Joueur 1" id="B0">
<input class="teamB" placeholder="Joueur 2" id="B1">
<input class="teamB" placeholder="Joueur 3" id="B2">
<input class="teamB" placeholder="Joueur 4" id="B3">
</div>
</div>

<div class="card">
<h2>🧾 Feuille de match</h2>
<table id="scoreTable">
<thead>
<tr>
<th>Équipe</th><th>Joueur</th>
<th colspan="6">Partie 1</th>
<th colspan="6">Partie 2</th>
<th colspan="6">Partie 3</th>
<th>Total</th>
</tr>
<tr>
<th></th><th></th>
<th>1</th><th>5</th><th>10</th><th>15</th><th>20</th><th>T</th>
<th>1</th><th>5</th><th>10</th><th>15</th><th>20</th><th>T</th>
<th>1</th><th>5</th><th>10</th><th>15</th><th>20</th><th>T</th>
<th></th>
</tr>
</thead>
<tbody id="tableBody"></tbody>
</table>

<button onclick="generateTable()">Générer la feuille</button>
<button onclick="calculate()">Calculer les scores</button>
</div>

<script>
function generateTable() {
  const tbody = document.getElementById('tableBody');
  tbody.innerHTML = '';

  ['A','B'].forEach(team => {
    for (let i = 0; i < 4; i++) {
      const name = document.getElementById(team + i).value || `Joueur ${i+1}`;
      let row = `<tr class="team${team}"><td>${team}</td><td>${name}</td>`;

      for (let j = 0; j < 3; j++) {
        for (let k = 0; k < 5; k++) {
          row += `<td><input type="number" id="${team}_${i}_${j}_${k}"></td>`;
        }
        row += `<td id="total_${team}_${i}_${j}"></td>`;
      }

      row += `<td id="grand_${team}_${i}"></td></tr>`;
      tbody.innerHTML += row;
    }
  });
}

function calculate() {
  ['A','B'].forEach(team => {
    for (let i = 0; i < 4; i++) {
      let grand = 0;
      for (let j = 0; j < 3; j++) {
        let part = 0;
        for (let k = 0; k < 5; k++) {
          const val = parseInt(document.getElementById(`${team}_${i}_${j}_${k}`)?.value) || 0;
          part += val;
        }
        document.getElementById(`total_${team}_${i}_${j}`).innerText = part;
        grand += part;
      }
      document.getElementById(`grand_${team}_${i}`).innerText = grand;
    }
  });
}
</script>

</body>
</html>
