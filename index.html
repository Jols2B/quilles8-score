<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quilles de 8</title>

<style>
body { font-family: Arial; background:#eef2f7; padding:20px; margin:0; }
.card { background:white; border-radius:12px; padding:20px; margin-bottom:20px; box-shadow:0 4px 10px rgba(0,0,0,0.1); overflow-x:auto; }
h1 { text-align:center; }

input { width:100%; padding:8px; margin:5px 0; border-radius:6px; border:1px solid #ccc; }
button { padding:12px; border:none; border-radius:8px; background:#4CAF50; color:white; width:100%; }

table { width:100%; min-width:900px; border-collapse:collapse; }
th, td { border:1px solid #ddd; padding:6px; text-align:center; }
th { background:#4CAF50; color:white; }

.status { text-align:center; padding:10px; border-radius:8px; margin-bottom:15px; }
.admin { background:#d0f0d0; }
.reader { background:#fff3cd; }

@media (max-width:600px){
  body{padding:8px;}
}
</style>
</head>

<body>

<h1>🏆 Match Quilles de 8</h1>
<div id="modeStatus" class="status"></div>

<div class="card">
<input id="competitionName" placeholder="Nom compétition">
<input id="competitionDate" type="date">
</div>

<div class="card">
<h2>Équipes</h2>
<input class="player" data-team="A" data-i="0" placeholder="A Joueur 1">
<input class="player" data-team="A" data-i="1" placeholder="A Joueur 2">
<input class="player" data-team="A" data-i="2" placeholder="A Joueur 3">
<input class="player" data-team="A" data-i="3" placeholder="A Joueur 4">

<input class="player" data-team="B" data-i="0" placeholder="B Joueur 1">
<input class="player" data-team="B" data-i="1" placeholder="B Joueur 2">
<input class="player" data-team="B" data-i="2" placeholder="B Joueur 3">
<input class="player" data-team="B" data-i="3" placeholder="B Joueur 4">
</div>

<div class="card">
<h2>Scores</h2>
<table>
<thead>
<tr>
<th>Équipe</th><th>Joueur</th><th>Scores</th><th>Total</th>
</tr>
</thead>
<tbody id="tableBody"></tbody>
</table>

<button id="reset">Reset</button>
</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<script>
const ADMIN_CODE="1234";
const isAdmin=new URLSearchParams(location.search).get("admin")===ADMIN_CODE;

document.getElementById("modeStatus").innerText=
isAdmin?"Mode admin":"Mode lecture";

const firebaseConfig={
apiKey:"AIzaSyAM0lcs5qFa_8NBnIdg7RZdL2TkWK6KQyc",
authDomain:"scores-quilles.firebaseapp.com",
databaseURL:"https://scores-quilles-default-rtdb.firebaseio.com/",
projectId:"scores-quilles",
storageBucket:"scores-quilles.firebasestorage.app",
messagingSenderId:"188142820091",
appId:"1:188142820091:web:c2493f0b026440e3f66e5e"
};

firebase.initializeApp(firebaseConfig);
const db=firebase.database().ref("match");

let data={
name:"",
date:"",
teams:{A:["","","",""],B:["","","",""]},
scores:{}
};

function draw(){
const tbody=document.getElementById("tableBody");
tbody.innerHTML="";

["A","B"].forEach(team=>{
for(let i=0;i<4;i++){
let name=data.teams[team][i]||"Joueur";
let total=0;

let row=`<tr><td>${team}</td><td>${name}</td><td>`;

for(let j=0;j<5;j++){
let id=`${team}_${i}_${j}`;
let val=data.scores[id]||0;
total+=Number(val);

row+=`<input type="number" value="${val}" data-id="${id}" ${isAdmin?"":"disabled"}>`;
}

row+=`</td><td>${total}</td></tr>`;
tbody.innerHTML+=row;
}
});

document.querySelectorAll("[data-id]").forEach(inp=>{
inp.onchange=()=>{
if(!isAdmin)return;
data.scores[inp.dataset.id]=inp.value;
save();
};
});
}

function save(){
db.set(data);
}

db.on("value",snap=>{
if(snap.val())data=snap.val();
update();
draw();
});

function update(){
document.getElementById("competitionName").value=data.name||"";
document.getElementById("competitionDate").value=data.date||"";

document.querySelectorAll(".player").forEach(inp=>{
let t=inp.dataset.team;
let i=inp.dataset.i;
inp.value=data.teams[t][i]||"";
});

if(!isAdmin){
document.querySelectorAll("input").forEach(i=>i.disabled=true);
document.getElementById("reset").style.display="none";
}
}

document.getElementById("competitionName").onchange=e=>{
if(!isAdmin)return;
data.name=e.target.value;
save();
};

document.getElementById("competitionDate").onchange=e=>{
if(!isAdmin)return;
data.date=e.target.value;
save();
};

document.querySelectorAll(".player").forEach(inp=>{
inp.onchange=()=>{
if(!isAdmin)return;
data.teams[inp.dataset.team][inp.dataset.i]=inp.value;
save();
draw();
};
});

document.getElementById("reset").onclick=()=>{
if(!isAdmin)return;
if(confirm("Reset ?")){
data={name:"",date:"",teams:{A:["","","",""],B:["","","",""]},scores:{}};
save();
}
};
</script>

</body>
</html>
